<html lang="th">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Sarabun;src:url(fonts/sarabun-thai-400.woff2) format('woff2');font-weight:400;unicode-range:U+0E00-0E7F;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-thai-600.woff2) format('woff2');font-weight:500 600;unicode-range:U+0E00-0E7F;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-thai-700.woff2) format('woff2');font-weight:700;unicode-range:U+0E00-0E7F;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-latin-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-latin-600.woff2) format('woff2');font-weight:500 600;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-latin-700.woff2) format('woff2');font-weight:700;font-display:swap}
/* Layout: one working column (max 1080px) under a sticky tab rail; the answer-form blue is the accent. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf3; --line:#d3d9e3; --ink:#18202c; --muted:#5b6678;
  --accent:#1f4fa8; --accent-ink:#ffffff; --accent-soft:#e2eaf8;
  --ok:#17784a; --ok-soft:#dff2e8; --bad:#b4302a; --bad-soft:#fae3e1; --warn:#9a6200; --warn-soft:#fbefd6;
  --ui:Sarabun,"Noto Sans Thai",system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a2029; --sunk:#232b37; --line:#2f3947; --ink:#e7ecf3; --muted:#9aa6b8;
  --accent:#7ea6f2; --accent-ink:#0d1320; --accent-soft:#1f2c45;
  --ok:#5cc792; --ok-soft:#173326; --bad:#f08a80; --bad-soft:#3a1f1d; --warn:#e5b45a; --warn-soft:#382c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a2029; --sunk:#232b37; --line:#2f3947; --ink:#e7ecf3; --muted:#9aa6b8;
  --accent:#7ea6f2; --accent-ink:#0d1320; --accent-soft:#1f2c45;
  --ok:#5cc792; --ok-soft:#173326; --bad:#f08a80; --bad-soft:#3a1f1d; --warn:#e5b45a; --warn-soft:#382c14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--ui);margin:0;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:20px 12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:20px;line-height:1.2;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.exam-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent)}
.btn.primary,button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-block:4px 0;scrollbar-width:none}
nav.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:9px 14px;border-bottom:2px solid transparent}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .count{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:20px;padding:0 7px;color:var(--muted)}
section.panel{padding-top:20px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14.5px;margin:0 0 6px}
.hint{color:var(--muted);font-size:13.5px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 200px;min-width:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:1px 9px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--sunk);color:var(--muted)}
/* key grid */
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:2px 18px}
.krow{display:flex;align-items:center;gap:4px;padding:2px 0}
.krow .n{width:30px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted);margin-right:4px}
.bub{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;padding:0;justify-content:center;line-height:1}
.bub:hover{border-color:var(--accent)}
.bub.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.bub.on.right{background:var(--ok);border-color:var(--ok)}
.bub.on.wrong{background:var(--bad);border-color:var(--bad)}
.bub.det{box-shadow:0 0 0 2px var(--warn)}
.krow.missing .n{color:var(--bad);font-weight:600}
/* drop zone */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;display:grid;gap:12px;justify-items:center;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.btn.big,button.big{padding:11px 20px;font-size:16px}
.latest{display:grid;gap:14px}
.latest.okb{border-color:var(--ok)} .latest.warnb{border-color:var(--warn)} .latest.badb{border-color:var(--bad)}
.latest-main{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between}
.latest-score{font-size:44px;font-weight:600;line-height:1.1}
.latest-score small{font-size:20px;color:var(--muted);font-weight:400}
.progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;width:100%;max-width:420px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
/* tables */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.3}
.stat span{font-size:12.5px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.choicebar{display:flex;height:16px;border-radius:4px;overflow:hidden;min-width:150px;background:var(--sunk)}
.choicebar i{display:block;height:100%}
/* review drawer */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(1000px,100%);height:100%;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 16px;z-index:2}
.drawer-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px}
@media (max-width:760px){.drawer-body{grid-template-columns:minmax(0,1fr)}}
.sheetview{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheetview canvas{display:block;width:100%;height:auto}
.toast{z-index:60!important;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px}
.sheetprev{max-width:340px;width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
ol.tips{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.hist{display:flex;align-items:flex-end;gap:2px;height:110px;padding-top:6px}
.hist div{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.histax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.syncchip{border:0;cursor:pointer;font:inherit;font-size:13px;padding:4px 11px}
#layer2 .overlay{z-index:45}
.steps{margin:6px 0 10px;padding-left:22px;display:grid;gap:10px}
pre.code{max-height:260px;overflow:auto;background:var(--sunk);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);white-space:pre}
summary{cursor:pointer}
.cam{position:fixed;inset:0;z-index:30;background:#000;color:#fff}
.cam video,.cam #camOv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.camtop{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0))}
.camtop>div{flex:1;min-width:0;display:grid;line-height:1.35}
.camtop>div b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camtop span{font-size:13px;opacity:.85}
.camtop button{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.camtop button.primary{background:#2f6fe0;color:#fff}
.camtop button.on{background:#f1c40f;color:#111}
.camhint{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.62);color:#fff;padding:7px 16px;border-radius:20px;font-size:15px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.camhint.done{background:#17784a}
.camres{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.camres.okb{border-color:var(--ok)} .camres.warnb{border-color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><circle cx="11" cy="12" r="4" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/><circle cx="23" cy="12" r="4" fill="var(--accent-ink)"/><circle cx="11" cy="23" r="4" fill="var(--accent-ink)"/><circle cx="23" cy="23" r="4" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/></svg>
      <div><h1>ตรวจข้อสอบ</h1><small>กระดาษคำตอบแบบฝน · คณะวิทยาศาสตร์และเทคโนโลยี มรภ.สงขลา</small></div>
    </div>
    <div class="hdr-actions"><button id="syncChip" class="chip plain syncchip">Google Sheet</button><button id="installBtn" class="primary" hidden>ติดตั้งแอป</button></div>
    <div class="exam-pick">
      <label for="examSel" class="hint">ชุดข้อสอบ</label>
      <select id="examSel"></select>
      <button id="newExam">+ ชุดใหม่</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="scan" aria-selected="true">สแกน</button>
    <button role="tab" data-tab="scores">คะแนน <span class="count" id="cntScores">0</span></button>
    <button role="tab" data-tab="key">เฉลย</button>
    <button role="tab" data-tab="items">วิเคราะห์ข้อสอบ</button>
    <button role="tab" data-tab="sheet">กระดาษคำตอบ</button>
    <button role="tab" data-tab="gs">Google Sheet</button>
  </nav>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div id="layer2"></div>

<script>
/* OMR engine: finds the 4 corner markers, maps the template, reads bubbles.
   Works on {width, height, data: RGBA Uint8ClampedArray}. No dependencies. */
(function (root) {
  'use strict';

  function grayOf(img, mode) {
    const { width: w, height: h, data } = img;
    const g = new Float32Array(w * h);
    for (let i = 0, j = 0; i < g.length; i++, j += 4) {
      const r = data[j], gg = data[j + 1], b = data[j + 2];
      g[i] = mode === 'min' ? Math.min(r, gg, b) : 0.299 * r + 0.587 * gg + 0.114 * b;
    }
    return { w, h, g };
  }

  function downscale(G, maxDim) {
    const s = Math.min(1, maxDim / Math.max(G.w, G.h));
    if (s === 1) return { w: G.w, h: G.h, g: G.g, s: 1 };
    const w = Math.max(1, Math.round(G.w * s)), h = Math.max(1, Math.round(G.h * s));
    const g = new Float32Array(w * h), cnt = new Float32Array(w * h);
    for (let y = 0; y < G.h; y++) {
      const ty = Math.min(h - 1, (y * s) | 0);
      for (let x = 0; x < G.w; x++) {
        const tx = Math.min(w - 1, (x * s) | 0), k = ty * w + tx;
        g[k] += G.g[y * G.w + x]; cnt[k]++;
      }
    }
    for (let i = 0; i < g.length; i++) g[i] = cnt[i] ? g[i] / cnt[i] : 255;
    return { w, h, g, s: w / G.w };
  }

  function integral(G) {
    const { w, h, g } = G, I = new Float64Array((w + 1) * (h + 1));
    for (let y = 0; y < h; y++) {
      let row = 0;
      for (let x = 0; x < w; x++) {
        row += g[y * w + x];
        I[(y + 1) * (w + 1) + x + 1] = I[y * (w + 1) + x + 1] + row;
      }
    }
    return I;
  }

  function binarize(G, win, k) {
    const { w, h, g } = G, I = integral(G), B = new Uint8Array(w * h), r = win >> 1;
    for (let y = 0; y < h; y++) {
      const y0 = Math.max(0, y - r), y1 = Math.min(h, y + r + 1);
      for (let x = 0; x < w; x++) {
        const x0 = Math.max(0, x - r), x1 = Math.min(w, x + r + 1);
        const sum = I[y1 * (w + 1) + x1] - I[y0 * (w + 1) + x1] - I[y1 * (w + 1) + x0] + I[y0 * (w + 1) + x0];
        const mean = sum / ((x1 - x0) * (y1 - y0));
        B[y * w + x] = g[y * w + x] < mean * k ? 1 : 0;
      }
    }
    return B;
  }

  function components(B, w, h) {
    const lab = new Int32Array(w * h), parent = [0];
    const find = (a) => { while (parent[a] !== a) { parent[a] = parent[parent[a]]; a = parent[a]; } return a; };
    let next = 1;
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (!B[i]) continue;
      const n = [];
      if (x > 0 && lab[i - 1]) n.push(lab[i - 1]);
      if (y > 0) {
        if (lab[i - w]) n.push(lab[i - w]);
        if (x > 0 && lab[i - w - 1]) n.push(lab[i - w - 1]);
        if (x < w - 1 && lab[i - w + 1]) n.push(lab[i - w + 1]);
      }
      if (!n.length) { parent.push(next); lab[i] = next++; continue; }
      let m = find(n[0]);
      for (let t = 1; t < n.length; t++) { const r = find(n[t]); if (r !== m) { if (r < m) { parent[m] = r; m = r; } else parent[r] = m; } }
      lab[i] = m;
    }
    const st = new Map();
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = y * w + x; if (!lab[i]) continue;
      const r = find(lab[i]);
      let s = st.get(r);
      if (!s) { s = { n: 0, sx: 0, sy: 0, sxx: 0, syy: 0, sxy: 0, x0: x, x1: x, y0: y, y1: y }; st.set(r, s); }
      s.n++; s.sx += x; s.sy += y; s.sxx += x * x; s.syy += y * y; s.sxy += x * y;
      if (x < s.x0) s.x0 = x; if (x > s.x1) s.x1 = x; if (y < s.y0) s.y0 = y; if (y > s.y1) s.y1 = y;
    }
    return [...st.values()];
  }

  function squareCandidates(comps, maxDim) {
    const out = [];
    const amin = Math.pow(maxDim * 0.007, 2), amax = Math.pow(maxDim * 0.09, 2);
    for (const c of comps) {
      if (c.n < amin || c.n > amax || c.n < 12) continue;
      const bw = c.x1 - c.x0 + 1, bh = c.y1 - c.y0 + 1;
      if (bw / bh > 2.2 || bh / bw > 2.2) continue;
      const fill = c.n / (bw * bh);
      if (fill < 0.45) continue;
      const cx = c.sx / c.n, cy = c.sy / c.n;
      const m20 = c.sxx / c.n - cx * cx, m02 = c.syy / c.n - cy * cy, m11 = c.sxy / c.n - cx * cy;
      const J = (m20 + m02) / c.n;              // 1/6 for a filled square, 1/(2pi) for a disk
      if (J < 0.14 || J > 0.205) continue;
      const tr = m20 + m02, det = m20 * m02 - m11 * m11, disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));
      const l1 = tr / 2 + disc, l2 = tr / 2 - disc;
      if (l2 <= 0 || Math.sqrt(l1 / l2) > 1.6) continue;
      out.push({ x: cx, y: cy, a: c.n });
    }
    return out;
  }

  // Homography mapping src[i] -> dst[i] (4 points)
  function homography(src, dst) {
    const A = [], b = [];
    for (let i = 0; i < 4; i++) {
      const [x, y] = src[i], [u, v] = dst[i];
      A.push([x, y, 1, 0, 0, 0, -u * x, -u * y]); b.push(u);
      A.push([0, 0, 0, x, y, 1, -v * x, -v * y]); b.push(v);
    }
    const n = 8;
    for (let c = 0; c < n; c++) {
      let p = c;
      for (let r = c + 1; r < n; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
      if (Math.abs(A[p][c]) < 1e-12) return null;
      [A[c], A[p]] = [A[p], A[c]]; [b[c], b[p]] = [b[p], b[c]];
      for (let r = 0; r < n; r++) if (r !== c) {
        const f = A[r][c] / A[c][c];
        for (let k = c; k < n; k++) A[r][k] -= f * A[c][k];
        b[r] -= f * b[c];
      }
    }
    const h = b.map((v, i) => v / A[i][i]);
    return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
  }
  function apply(H, x, y) {
    const d = H[6] * x + H[7] * y + H[8];
    return [(H[0] * x + H[1] * y + H[2]) / d, (H[3] * x + H[4] * y + H[5]) / d];
  }

  function sample(G, x, y) {
    const { w, h, g } = G;
    if (x < 0 || y < 0 || x > w - 1.001 || y > h - 1.001) return 255;
    const x0 = x | 0, y0 = y | 0, fx = x - x0, fy = y - y0, i = y0 * w + x0;
    return g[i] * (1 - fx) * (1 - fy) + g[i + 1] * fx * (1 - fy) + g[i + w] * (1 - fx) * fy + g[i + w + 1] * fx * fy;
  }

  function percentile(arr, p) {
    const a = Float32Array.from(arr).sort();
    return a[Math.min(a.length - 1, Math.max(0, Math.round((a.length - 1) * p)))];
  }

  // darkness of a disk (mm) relative to the paper just around it
  function bubbleScore(G, H, cx, cy, r, mmPx) {
    const step = Math.max(0.12, Math.min(0.3, 0.6 / mmPx));
    const ri = r * 0.7, ring = [];
    for (let k = 0; k < 40; k++) {
      const a = (k / 40) * Math.PI * 2;
      for (const rr of [r * 1.3, r * 1.45]) {
        const [x, y] = apply(H, cx + rr * Math.cos(a), cy + rr * Math.sin(a));
        ring.push(sample(G, x, y));
      }
    }
    const bg = Math.max(60, percentile(ring, 0.85));
    let sum = 0, n = 0;
    for (let dy = -ri; dy <= ri; dy += step) for (let dx = -ri; dx <= ri; dx += step) {
      if (dx * dx + dy * dy > ri * ri) continue;
      const [x, y] = apply(H, cx + dx, cy + dy);
      const v = sample(G, x, y);
      sum += Math.min(1, Math.max(0, (bg - v) / bg)); n++;
    }
    return n ? sum / n : 0;
  }

  function regionDark(G, H, cx, cy, hw, hh) {
    let sum = 0, n = 0;
    for (let dy = -hh; dy <= hh; dy += hh / 4) for (let dx = -hw; dx <= hw; dx += hw / 8) {
      const [x, y] = apply(H, cx + dx, cy + dy); sum += sample(G, x, y); n++;
    }
    return sum / n;
  }

  function locate(img, L) {
    const lum = grayOf(img, 'lum');
    const D = downscale(lum, 1000);
    const maxDim = Math.max(D.w, D.h);
    let cands = [];
    for (const k of [0.72, 0.6, 0.82]) {
      const B = binarize(D, (Math.round(maxDim / 10) | 1), k);
      cands = squareCandidates(components(B, D.w, D.h), maxDim);
      const res = pickQuad(cands, D, L);
      if (res) {
        const s = D.s;
        const S = [s, 0, 0, 0, s, 0, 0, 0, 1];
        // H maps mm -> downscaled px; convert to full-res px
        const Hf = res.H.map((v, i) => (i < 6 ? v / s : v));
        return { H: Hf, rot: res.rot, corners: res.corners.map(([x, y]) => [x / s, y / s]), nCand: cands.length };
      }
    }
    return { error: 'markers', nCand: cands.length, cands: cands.slice(0, 12) };
  }

  // the sheet's fixed print must be where the template says: dark bar and markers, blank paper at known spots
  function verify(D, H, L) {
    const [W, Hh] = L.page;
    const dark = [regionDark(D, H, L.bar[0], L.bar[1], 13, 1.4)].concat(L.fid.map(([x, y]) => regionDark(D, H, x, y, 2, 2)));
    const paperSpots = [[L.bar[0] - 42, L.bar[1], 6, 1.2], [L.bar[0] + 42, L.bar[1], 6, 1.2], [W / 2 + 10, 18, 6, 1.2],
      [W / 2, Hh - 8.5, 12, 1.2], [L.fid[0][0] - 1, Hh / 2, 0.8, 30], [L.fid[1][0] + 1, Hh / 2, 0.8, 30]];
    const paperVals = paperSpots.map(([x, y, hw, hh]) => regionDark(D, H, x, y, hw, hh));
    const paper = Math.min(...paperVals), dk = Math.max(...dark);
    return { sc: paper - dk, paper, dark: dk };
  }

  function pickQuad(cands, D, L) {
    if (cands.length < 4) return null;
    cands.sort((a, b) => b.a - a.a);
    const C = cands.slice(0, 24);
    const tmplRatio = (L.fidSize * L.fidSize) / ((L.fid[1][0] - L.fid[0][0]) * (L.fid[3][1] - L.fid[0][1]));
    const combos = [];
    for (let a = 0; a < C.length; a++) for (let b = a + 1; b < C.length; b++)
      for (let c = b + 1; c < C.length; c++) for (let d = c + 1; d < C.length; d++) {
        const q = [C[a], C[b], C[c], C[d]];
        const areas = q.map((p) => p.a), mx = Math.max(...areas), mn = Math.min(...areas);
        if (mx / mn > 4) continue;
        const cx = (q[0].x + q[1].x + q[2].x + q[3].x) / 4, cy = (q[0].y + q[1].y + q[2].y + q[3].y) / 4;
        q.sort((p1, p2) => Math.atan2(p1.y - cy, p1.x - cx) - Math.atan2(p2.y - cy, p2.x - cx));
        let area = 0, convex = true, sign = 0;
        for (let i = 0; i < 4; i++) {
          const p = q[i], n1 = q[(i + 1) % 4], n2 = q[(i + 2) % 4];
          area += p.x * n1.y - n1.x * p.y;
          const cr = (n1.x - p.x) * (n2.y - n1.y) - (n1.y - p.y) * (n2.x - n1.x);
          if (sign === 0) sign = Math.sign(cr); else if (Math.sign(cr) !== sign) convex = false;
        }
        area = Math.abs(area) / 2;
        if (!convex || area <= 0) continue;
        const ratio = (areas.reduce((s, v) => s + v, 0) / 4) / area / tmplRatio;
        if (ratio < 0.45 || ratio > 2.2) continue;
        combos.push({ q, area });
      }
    combos.sort((a, b) => b.area - a.area);
    for (const { q } of combos.slice(0, 60)) {
      const pts = q.map((p) => [p.x, p.y]);
      let best = null;
      for (let rot = 0; rot < 4; rot++) {
        const dst = [0, 1, 2, 3].map((i) => pts[(i + rot) % 4]);
        const H = homography(L.fid, dst);
        if (!H) continue;
        const v = verify(D, H, L);
        if (!best || v.sc > best.sc) best = Object.assign(v, { H, rot, corners: dst });
      }
      if (best && best.sc > 0.3 * best.paper) return best;
    }
    return null;
  }

  function decide(scores, base, T) {
    const rel = scores.map((s) => s - base);
    let i1 = -1, i2 = -1;
    rel.forEach((v, i) => { if (i1 < 0 || v > rel[i1]) { i2 = i1; i1 = i; } else if (i2 < 0 || v > rel[i2]) i2 = i; });
    const m = rel[i1], m2 = i2 >= 0 ? rel[i2] : -1;
    if (m < T) return { pick: -1, state: m > T * 0.6 ? 'unsure' : 'blank', rel };
    if (m2 >= T && m2 >= 0.55 * m) return { pick: -2, state: 'multi', rel, picks: rel.map((v, i) => (v >= T && v >= 0.55 * m ? i : -1)).filter((i) => i >= 0) };
    const unsure = m < T * 1.5 || m2 > T * 0.7;
    return { pick: i1, state: unsure ? 'unsure' : 'ok', rel };
  }

  function read(img, L, opt) {
    opt = opt || {};
    const loc = locate(img, L);
    if (loc.error) return { ok: false, error: loc.error, dbg: loc };
    const G = grayOf(img, 'min');
    const H = loc.H;
    const [ax] = apply(H, 0, 0), [bx] = apply(H, 10, 0);
    const mmPx = Math.hypot(...(() => { const p = apply(H, 0, 0), q = apply(H, 10, 0); return [q[0] - p[0], q[1] - p[1]]; })()) / 10;
    const nq = opt.numQ || L.questions.length;
    const qs = [], all = [];
    for (let q = 0; q < nq; q++) {
      const s = L.questions[q].map(([x, y]) => bubbleScore(G, H, x, y, L.qR, mmPx));
      qs.push(s); all.push(...s);
    }
    const ids = L.idCols.map((col) => col.map(([x, y]) => bubbleScore(G, H, x, y, L.idR, mmPx)));
    ids.forEach((c) => all.push(...c));
    const base = percentile(all, 0.3);
    // adaptive threshold: half of the typical mark strength, never below the noise floor
    const rowMax = qs.concat(ids).map((s) => Math.max(...s) - base);
    const dev = all.map((v) => Math.abs(v - base));
    const noiseFloor = percentile(dev, 0.6) * 6;
    const T = opt.threshold || Math.min(0.09, Math.max(0.025, noiseFloor, 0.45 * percentile(rowMax, 0.5)));
    const answers = qs.map((s) => decide(s, base, T));
    const idDec = ids.map((s) => decide(s, base, T));
    let digits = idDec.map((d) => (d.pick >= 0 ? String(d.pick) : d.state === 'blank' ? ' ' : '?'));
    let sid = digits.join('').trim();
    return { ok: true, T, H, mmPx, corners: loc.corners, rot: loc.rot, base, answers, id: { str: sid, cols: idDec } };
  }

  const api = { read, locate, apply, homography };
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.OMR = api;
})(typeof self !== 'undefined' ? self : this);

const TH = ['ก','ข','ค','ง','จ'];
const LET = 'ABCDE';
const GS_CODE = "/**\n * ตรวจข้อสอบ OMR → Google Sheet\n * วางโค้ดนี้ใน ส่วนขยาย > Apps Script ของ Google Sheet ที่จะเก็บคะแนน\n * แล้วทำให้ใช้งานได้เป็น \"เว็บแอป\" (สิทธิ์เข้าถึง: ทุกคน)\n * ห้ามแก้ TOKEN ถ้าไม่ได้แก้ในแอปด้วย\n */\nconst TOKEN = '__TOKEN__';\n\nconst FIXED = ['รหัสนักศึกษา', 'คะแนน', 'คะแนนเต็ม', 'ร้อยละ', 'ต้องตรวจ (จุด)', 'เวลาสแกน', 'รหัสอ้างอิง'];\nconst UID_COL = 7;          // column G holds the app's record id\nconst FIRST_ROW = 3;        // row 1 header, row 2 answer key\n\nfunction doGet() {\n  return out_({ ok: true, app: 'omr-skru', sheet: SpreadsheetApp.getActiveSpreadsheet().getName() });\n}\n\nfunction doPost(e) {\n  let body;\n  try { body = JSON.parse(e.postData.contents); } catch (err) { return out_({ ok: false, error: 'bad_json' }); }\n  if (!body || body.token !== TOKEN) return out_({ ok: false, error: 'token' });\n  const lock = LockService.getScriptLock();\n  lock.waitLock(25000);\n  try {\n    if (body.action === 'ping') return out_({ ok: true, sheet: SpreadsheetApp.getActiveSpreadsheet().getName(), url: SpreadsheetApp.getActiveSpreadsheet().getUrl() });\n    if (body.action === 'sync') return out_(sync_(body));\n    return out_({ ok: false, error: 'action' });\n  } catch (err) {\n    return out_({ ok: false, error: String(err && err.message || err) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\nfunction sync_(body) {\n  const ex = body.exam;\n  const sh = sheetFor_(ex);\n  const n = Math.max(1, Math.min(100, ex.numQ | 0));\n  const width = FIXED.length + n;\n\n  // header + key rows\n  const head = FIXED.concat(Array.from({ length: n }, (_, i) => 'ข้อ ' + (i + 1)));\n  const keyRow = ['เฉลย', '', '', '', '', '', ''].concat(ex.keyTh.slice(0, n));\n  while (keyRow.length < width) keyRow.push('');\n  sh.getRange(1, 1, 2, width).setValues([head, keyRow]);\n  const lastCol = sh.getLastColumn();\n  if (lastCol > width) sh.getRange(1, width + 1, Math.max(1, sh.getLastRow()), lastCol - width).clearContent();\n  sh.getRange(1, 1, 2, width).setFontWeight('bold');\n  sh.getRange('A:A').setNumberFormat('@');\n  sh.getRange(1, UID_COL, Math.max(2, sh.getLastRow()), 1).setFontColor('#999999');\n  if (sh.getFrozenRows() !== 2) sh.setFrozenRows(2);\n\n  // existing rows by record id\n  const index = () => {\n    const last = sh.getLastRow(), map = {};\n    if (last >= FIRST_ROW) {\n      const ids = sh.getRange(FIRST_ROW, UID_COL, last - FIRST_ROW + 1, 1).getValues();\n      ids.forEach((r, i) => { if (r[0]) map[String(r[0])] = FIRST_ROW + i; });\n    }\n    return map;\n  };\n\n  // deletions, bottom-up so row numbers stay valid\n  let map = index();\n  const del = (body.deletes || []).map((u) => map[u]).filter(Boolean).sort((a, b) => b - a);\n  del.forEach((r) => sh.deleteRow(r));\n  if (del.length) map = index();\n\n  const appends = [], synced = [];\n  (body.rows || []).forEach((r) => {\n    const row = [String(r.sid || ''), r.score, r.total, r.pct, r.flags || '', r.at ? new Date(r.at) : '', r.uid]\n      .concat((r.ansTh || []).slice(0, n));\n    while (row.length < width) row.push('');\n    const at = map[r.uid];\n    if (at) sh.getRange(at, 1, 1, width).setValues([row]);\n    else appends.push(row);\n    synced.push(r.uid);\n  });\n  if (appends.length) {\n    const start = Math.max(sh.getLastRow() + 1, FIRST_ROW);\n    sh.getRange(start, 1, appends.length, width).setValues(appends);\n  }\n  const last = sh.getLastRow();\n  if (last > FIRST_ROW) sh.getRange(FIRST_ROW, 1, last - FIRST_ROW + 1, width).sort(1);\n  if (last >= FIRST_ROW) sh.getRange(FIRST_ROW, 6, last - FIRST_ROW + 1, 1).setNumberFormat('d/m/yyyy HH:mm');\n\n  return { ok: true, synced: synced, deleted: body.deletes || [], tab: sh.getName(), url: SpreadsheetApp.getActiveSpreadsheet().getUrl() + '#gid=' + sh.getSheetId() };\n}\n\nfunction sheetFor_(ex) {\n  const ss = SpreadsheetApp.getActiveSpreadsheet();\n  const want = safeName_(ex.name || 'ชุดข้อสอบ');\n  let sh = ss.getSheets().filter((s) => s.getRange('A1').getNote() === ex.id)[0];\n  if (!sh) {\n    let name = want, i = 2;\n    while (ss.getSheetByName(name)) name = want + ' (' + (i++) + ')';\n    sh = ss.insertSheet(name);\n    sh.getRange('A1').setNote(ex.id);\n  } else if (sh.getName() !== want && !ss.getSheetByName(want)) {\n    sh.setName(want);\n  }\n  return sh;\n}\n\nfunction safeName_(s) {\n  return String(s).replace(/[\\[\\]\\*\\?\\/\\\\:]/g, ' ').trim().slice(0, 90) || 'ชุดข้อสอบ';\n}\n\nfunction out_(o) {\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n";
const APP_VERSION = '1.0.0';
const SEED = {name:'GESC401 Final 1/2569', numQ:60, key:'BEADEDBECACBCBDABDCBECAEAEDDADAAADBCEDABBADCEECECDBEDACDEEBA'};

/* ---------- storage: this device (Google Sheet keeps the shared copy) ---------- */
const Store = {
  mode:'local',
  async init(){ try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(e){} },
  localAll(){ try{ return JSON.parse(localStorage.getItem('omr-exams')||'[]'); }catch(e){ return []; } },
  localPut(list){ try{ localStorage.setItem('omr-exams', JSON.stringify(list)); }catch(e){ toast('พื้นที่เก็บข้อมูลในเครื่องเต็ม'); } },
  async list(){ return this.localAll(); },
  async save(ex){ ex.updatedAt=Date.now(); const l=this.localAll().filter(x=>x.id!==ex.id); l.push(JSON.parse(JSON.stringify(ex))); this.localPut(l); return true; },
  async remove(id){ this.localPut(this.localAll().filter(x=>x.id!==id)); }
};

/* ---------- state ---------- */
const S = { exams:[], cur:null, tab:'scan', session:[], images:{}, busy:false, prog:0, progText:'', pending:null };
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const exam = ()=> S.exams.find(e=>e.id===S.cur);
function newId(){ return 'exam_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2800); }

function scoreOf(ex, ans){ let s=0; for(let i=0;i<ex.numQ;i++){ if(ex.key[i] && ex.key[i]!=='-' && ans[i]===ex.key[i]) s++; } return s; }
function keyCount(ex){ let n=0; for(let i=0;i<ex.numQ;i++) if(ex.key[i] && 'ABCDE'.includes(ex.key[i])) n++; return n; }
function thAns(c){ const i=LET.indexOf(c); return i>=0?TH[i]:(c==='*'?'หลายข้อ':'–'); }

async function persist(){ const ex=exam(); if(ex) await Store.save(ex); scheduleSync(); }

/* ---------- boot ---------- */
async function boot(){
  render();
  await Store.init();
  S.exams = await Store.list();
  if(!S.exams.length){
    const ex = {id:newId(), name:SEED.name, numQ:SEED.numQ, key:SEED.key, results:[], createdAt:Date.now()};
    S.exams=[ex]; await Store.save(ex);
  }
  S.exams.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
  let last=null; try{ last=localStorage.getItem('omr-cur'); }catch(e){}
  S.cur = (S.exams.find(e=>e.id===last)||S.exams[0]).id;
  render(); scheduleSync(2500);
}

/* ---------- rendering ---------- */
function render(){
  const sel=$('#examSel');
  sel.innerHTML = S.exams.map(e=>`<option value="${e.id}" ${e.id===S.cur?'selected':''}>${esc(e.name)}</option>`).join('') || '<option>กำลังโหลด…</option>';
  document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.tab===S.tab)));
  const ex=exam();
  $('#cntScores').textContent = ex? ex.results.length : 0;
  updateSyncChip();
  const m=$('#main');
  if(!ex){ m.innerHTML='<section class="panel"><div class="card empty">กำลังโหลดข้อมูล…</div></section>'; return; }
  m.innerHTML = '<section class="panel">'+({scan:viewScan,scores:viewScores,key:viewKey,items:viewItems,sheet:viewSheet,gs:viewGs}[S.tab])(ex)+'</section>';
  bindView(ex);
}

function viewScan(ex){
  const kc=keyCount(ex);
  const warn = kc<ex.numQ ? `<div class="card" style="border-color:var(--warn)"><b style="color:var(--warn)">เฉลยยังไม่ครบ</b> <span class="hint">กรอกแล้ว ${kc} จาก ${ex.numQ} ข้อ ตรวจได้ แต่ข้อที่ไม่มีเฉลยจะไม่นับคะแนน</span> <button data-go="key">ไปที่เฉลย</button></div>`:'';
  const rows = S.session.filter(r=>r.exam===ex.id);
  const list = rows.length ? `<div class="tablebox"><table><thead><tr><th>ไฟล์</th><th>รหัสนักศึกษา</th><th class="num">คะแนน</th><th>สถานะ</th></tr></thead><tbody>${
    rows.slice().reverse().map(r=>{
      if(r.error) return `<tr><td>${esc(r.src)}</td><td colspan="2" class="hint">${esc(r.error)}</td><td><span class="chip bad">อ่านไม่ได้</span></td></tr>`;
      const res = ex.results.find(x=>x.uid===r.uid);
      if(!res) return '';

function flagsOf(r){ return (r.flags||[]).length + (/^\d+$/.test(r.sid||'')?0:1); }

function stats(arr){
  const n=arr.length; if(!n) return null;
  const s=[...arr].sort((a,b)=>a-b), mean=arr.reduce((a,b)=>a+b,0)/n;
  const sd=Math.sqrt(arr.reduce((a,b)=>a+(b-mean)**2,0)/(n>1?n-1:1));
  const med = n%2? s[(n-1)/2] : (s[n/2-1]+s[n/2])/2;
  return {n,mean,sd,med,min:s[0],max:s[n-1]};
}

function itemAnalysis(ex){
  const rs=ex.results; const n=rs.length; if(!n) return null;
  const sc=rs.map(r=>scoreOf(ex,r.ans));
  const order=rs.map((r,i)=>i).sort((a,b)=>sc[b]-sc[a]);
  const g=Math.max(1,Math.round(n*0.27));
  const hi=order.slice(0,g), lo=order.slice(-g);
  const out=[];
  for(let q=0;q<ex.numQ;q++){
    const k=ex.key[q]; const cnt=[0,0,0,0,0,0]; // A-E, blank/multi
    rs.forEach(r=>{ const i=LET.indexOf(r.ans[q]); cnt[i>=0?i:5]++; });
    const valid='ABCDE'.includes(k);
    const p= valid? cnt[LET.indexOf(k)]/n : null;
    const rr= valid? (hi.filter(i=>rs[i].ans[q]===k).length - lo.filter(i=>rs[i].ans[q]===k).length)/g : null;
    const deadD = valid? LET.split('').filter((c,i)=>c!==k && cnt[i]/n<0.05).length : 0;
    out.push({q,k,cnt,p,r:rr,deadD});
  }
  return {n,g,items:out};
}

    <td><div class="choicebar" title="${TH.map((t,i)=>t+' '+it.cnt[i]).join(' · ')} · ไม่ตอบ/หลายข้อ ${it.cnt[5]}">${it.cnt.slice(0,5).map((c,i)=>`<i style="width:${c/A.n*100}%;background:${cols[i]};${LET[i]===it.k?'outline:2px solid var(--ok);outline-offset:-2px':''};opacity:${LET[i]===it.k?1:.55}"></i>`).join('')}</div>

/* ---------- events ---------- */
function bindView(ex){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.go;render();});
  document.querySelectorAll('[data-review]').forEach(tr=>tr.onclick=()=>openReview(tr.dataset.review));
  if(S.tab==='scan'){
    const drop=$('#drop');
    document.querySelectorAll('[data-live]').forEach(b=>b.onclick=openLive);
    const ih=$('#iosHintOff'); if(ih) ih.onclick=()=>{ Settings.iosHintOff=true; saveSettings(); render(); };
    $('#filePick').onchange=e=>{ handleFiles([...e.target.files]); e.target.value=''; };
    $('#camPick').onchange=e=>{ handleFiles([...e.target.files]); e.target.value=''; };
    ['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('over');}));
    ['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('over');}));
    drop.addEventListener('drop',e=>handleFiles([...e.dataTransfer.files]));
  }
  if(S.tab==='key'){
    document.querySelectorAll('[data-k]').forEach(b=>b.onclick=async()=>{
      const [q,i]=b.dataset.k.split(':').map(Number);
      const arr=padKey(ex); arr[q] = arr[q]===LET[i]?'-':LET[i]; ex.key=arr.join('');
      const row=b.parentElement; row.querySelectorAll('.bub').forEach((x,j)=>x.classList.toggle('on', ex.key[q]===LET[j]));
      row.classList.toggle('missing', ex.key[q]==='-');
      const kc=keyCount(ex); const ch=document.querySelector('.card .chip'); if(ch){ch.textContent=`${kc}/${ex.numQ} ข้อ`; ch.className='chip '+(kc===ex.numQ?'ok':'warn');}
      await persist();
    });
    $('#exName').onchange=async e=>{ ex.name=e.target.value.trim()||'ชุดข้อสอบ'; await persist(); render(); };
    $('#exN').onchange=async e=>{ const v=Math.max(1,Math.min(100,parseInt(e.target.value)||ex.numQ)); ex.numQ=v; ex.key=padKey(ex).join(''); await persist(); render(); };
    $('#keyApply').onclick=async()=>{
      const t=$('#keyText').value.replace(/\s|,/g,''); const map={'ก':'A','ข':'B','ค':'C','ง':'D','จ':'E','1':'A','2':'B','3':'C','4':'D','5':'E'};
      const arr=[...t].map(c=>map[c]||(LET.includes(c.toUpperCase())?c.toUpperCase():'-'));
      if(!arr.length) return;
      ex.numQ=Math.min(100,Math.max(ex.numQ, arr.length>ex.numQ?arr.length:ex.numQ));
      const k=padKey(ex); arr.slice(0,100).forEach((c,i)=>k[i]=c); ex.key=k.join('');

/* ---------- export ---------- */
function csvCell(v,sep){ v=String(v); return (v.includes(sep)||v.includes('"')||v.includes('\n'))?'"'+v.replace(/"/g,'""')+'"':v; }
function scoresCsv(ex,sep=','){
  const kc=keyCount(ex);
  const head=['ลำดับ','รหัสนักศึกษา','คะแนน','คะแนนเต็ม','ร้อยละ','ต้องตรวจ'].concat(Array.from({length:ex.numQ},(_,i)=>'ข้อ'+(i+1)));
  const rs=[...ex.results].sort((a,b)=>String(a.sid).localeCompare(String(b.sid)));
  const lines=[head.join(sep), ['','เฉลย','','','',''].concat([...padKey(ex)].map(thAns)).map(v=>csvCell(v,sep)).join(sep)];
  rs.forEach((r,i)=>{ const s=scoreOf(ex,r.ans); lines.push([i+1,"'"+(r.sid||''),s,kc,kc?(s/kc*100).toFixed(2):'',flagsOf(r)||''].concat([...r.ans.slice(0,ex.numQ)].map(thAns)).map(v=>csvCell(v,sep)).join(sep)); });
  return '﻿'+lines.join('\r\n');
}
function itemsCsv(ex){
  const A=itemAnalysis(ex);
  const lines=[['ข้อ','เฉลย','ความยาก p','อำนาจจำแนก r','ก','ข','ค','ง','จ','ไม่ตอบ/หลายข้อ','ตัวลวงไม่ทำงาน'].join(',')];
  A.items.forEach(it=>lines.push([it.q+1,thAns(it.k),it.p===null?'':it.p.toFixed(3),it.r===null?'':it.r.toFixed(3),...it.cnt,it.deadD].join(',')));
  return '﻿'+lines.join('\r\n');
}
function saveFile(name,data){
  const blob = data instanceof Blob ? data : new Blob([data],{type:/\.csv$/.test(name)?'text/csv;charset=utf-8':'application/octet-stream'});
  const url=URL.createObjectURL(blob), a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),5000);
}
async function copyText(t,msg){
  try{ await navigator.clipboard.writeText(t); toast(msg||'คัดลอกแล้ว วางใน Excel ได้เลย'); }
  catch(e){ const ta=document.createElement('textarea'); ta.value=t; ta.style.cssText='position:fixed;left:16px;right:16px;bottom:16px;height:40vh;z-index:50'; document.body.appendChild(ta); ta.select(); toast('กด Ctrl+C หรือคัดลอกจากกล่องนี้'); ta.onblur=()=>ta.remove(); }
}

/* ---------- image loading ---------- */
const MAXDIM=2000;
function toImageData(src,w,h){
  const s=Math.min(1,MAXDIM/Math.max(w,h)); const cw=Math.round(w*s), ch=Math.round(h*s);
  const c=document.createElement('canvas'); c.width=cw; c.height=ch; const x=c.getContext('2d',{willReadFrequently:true});
  x.fillStyle='#fff'; x.fillRect(0,0,cw,ch); x.drawImage(src,0,0,cw,ch);
  return {canvas:c, data:x.getImageData(0,0,cw,ch)};
}
async function loadImageFile(f){
  try{ const bm=await createImageBitmap(f,{imageOrientation:'from-image'}); const r=toImageData(bm,bm.width,bm.height); bm.close&&bm.close(); return r; }
  catch(e){ const url=URL.createObjectURL(f); try{ const im=new Image(); im.src=url; await im.decode(); return toImageData(im,im.naturalWidth,im.naturalHeight); } finally{ URL.revokeObjectURL(url); } }
}
let pdfReady=null;
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function ensurePdf(){
  if(!pdfReady) pdfReady=(async()=>{
    const base='vendor/';
    await loadScript(base+'pdf.min.js'); await loadScript(base+'pdf.worker.min.js');
    pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  })();
  return pdfReady;
}
async function* pdfPages(f){
  await ensurePdf();
  const doc=await pdfjsLib.getDocument({data:new Uint8Array(await f.arrayBuffer())}).promise;
  for(let p=1;p<=doc.numPages;p++){
    const page=await doc.getPage(p); const v0=page.getViewport({scale:1});
    const sc=MAXDIM/Math.max(v0.width,v0.height); const v=page.getViewport({scale:sc});
    const c=document.createElement('canvas'); c.width=Math.round(v.width); c.height=Math.round(v.height);
    const x=c.getContext('2d',{willReadFrequently:true}); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height);
    await page.render({canvasContext:x,viewport:v}).promise;
    yield {page:p,total:doc.numPages, canvas:c, data:x.getImageData(0,0,c.width,c.height)};
    page.cleanup();
  }
}
async function* expand(files){
  for(const f of files){
    const isPdf = f.type==='application/pdf' || /\.pdf$/i.test(f.name);
    if(isPdf){
      try{ for await (const pg of pdfPages(f)) yield {src:`${f.name} หน้า ${pg.page}`, ...pg}; }
      catch(e){ yield {src:f.name, error:'เปิดไฟล์ PDF ไม่ได้'}; }
    } else {
      try{ yield {src:f.name, ...(await loadImageFile(f))}; }
      catch(e){ yield {src:f.name, error:'เปิดไฟล์ภาพไม่ได้'}; }
    }
  }
}
const tick=()=>new Promise(r=>setTimeout(r,0));

// straightened copy of the sheet, 4 px per mm, for the review view
const RK=4;
function rectify(img, H){
  const W=Math.round(LAYOUT.page[0]*RK), Hh=Math.round(LAYOUT.page[1]*RK);
  const c=document.createElement('canvas'); c.width=W; c.height=Hh; const x=c.getContext('2d');
  const out=x.createImageData(W,Hh), o=out.data, d=img.data, iw=img.width, ih=img.height;
  for(let y=0;y<Hh;y++) for(let X=0;X<W;X++){
    const [u,v]=OMR.apply(H,(X+.5)/RK,(y+.5)/RK); const j=(y*W+X)*4;
    const xi=Math.round(u), yi=Math.round(v);
    if(xi<0||yi<0||xi>=iw||yi>=ih){ o[j]=o[j+1]=o[j+2]=255; o[j+3]=255; continue; }
    const i=(yi*iw+xi)*4; o[j]=d[i]; o[j+1]=d[i+1]; o[j+2]=d[i+2]; o[j+3]=255;
  }
  x.putImageData(out,0,0);
  return c.toDataURL('image/jpeg',0.75);
}

function resultFromRead(r, ex){
  const nq=ex.numQ; let ans=''; const flags=[];
  const multi={};
  for(let q=0;q<nq;q++){ const a=r.answers[q]; ans+= a.pick>=0?LET[a.pick]: a.state==='multi'?'*':'-'; if(a.state==='multi'||a.state==='unsure') flags.push(q); if(a.state==='multi') multi[q]=a.picks; }
  const sid=r.id.str.replace(/\s/g,'');
  return {ans, flags, sid, multi};
}

async function handleFiles(files){
  const ex=exam(); if(!ex||!files.length) return;
  if(S.busy){ toast('กำลังตรวจชุดก่อนหน้า รอสักครู่'); return; }
  S.busy=true; S.prog=2; S.progText='กำลังเปิดไฟล์…'; render();
  let done=0, ok=0, fail=0, est=files.length;
  for await (const it of expand(files)){
    if(it.total) est=Math.max(est, done+ (it.total-it.page+1) + (files.length-1));
    S.progText=`กำลังอ่าน ${it.src}`; S.prog=Math.min(98,Math.round(done/est*100)+2); updateProgress(); await tick();
    const entry={exam:ex.id, src:it.src, uid:null};
    if(it.error){ entry.error=it.error; fail++; }
    else{
      const r=OMR.read({width:it.data.width,height:it.data.height,data:it.data.data}, LAYOUT, {numQ:ex.numQ});
      if(!r.ok){ entry.error='หาสี่เหลี่ยมดำที่มุมไม่ครบ 4 มุม ถ่ายใหม่ให้เห็นทั้งแผ่น'; fail++; }
      else{
        const {rec,replaced}=addResult(ex, r, it.data, it.src);
        entry.uid=rec.uid; entry.replaced=replaced;
        ok++;
      }
    }
    S.session.push(entry); done++;
  }
  await persist();
  S.busy=false; render();
  toast(`ตรวจแล้ว ${ok} แผ่น${fail?` · อ่านไม่ได้ ${fail} แผ่น`:''}`);
}
function updateProgress(){ const p=document.querySelector('.progress i'); if(p) p.style.width=S.prog+'%'; const t=document.querySelector('.progress + p'); if(t) t.textContent=S.progText; if(!p) render(); }

async function readKeySheet(f){
  const ex=exam(); toast('กำลังอ่านเฉลย…');
  let first=null; for await (const it of expand([f])){ first=it; break; }
  if(!first||first.error){ toast('เปิดไฟล์ไม่ได้'); return; }
  const r=OMR.read({width:first.data.width,height:first.data.height,data:first.data.data}, LAYOUT, {numQ:100});
  if(!r.ok){ toast('หาสี่เหลี่ยมดำที่มุมไม่ครบ ถ่ายใหม่ให้เห็นทั้งแผ่น'); return; }
  let last=0; const k=r.answers.map((a,i)=>{ if(a.pick>=0){ last=i+1; return LET[a.pick]; } return '-'; });
  if(!last){ toast('ไม่พบคำตอบบนกระดาษแผ่นนี้'); return; }
  const unsure=r.answers.slice(0,last).filter(a=>a.state!=='ok').length;
  ex.numQ=last; ex.key=k.slice(0,last).join('');

  toast(`อ่านเฉลยได้ ${last} ข้อ${unsure?` · มี ${unsure} ข้อที่ควรตรวจ (ขอบแดง)`:''}`);
}

function paintSheet(img, ex, r){
  const c=$('#rvCanvas'); const im=new Image();
  im.onload=()=>{
    c.width=im.naturalWidth; c.height=im.naturalHeight; const x=c.getContext('2d'); x.drawImage(im,0,0);
        const col={ok:'#17a35e',bad:'#d6372e',warn:'#e9a400'};
    const P=(mx,my)=>[mx*RK,my*RK];
    const rad=LAYOUT.qR*RK*1.45, fl=new Set(r.flags||[]);
    x.lineWidth=Math.max(2,rad*0.28);
    for(let q=0;q<ex.numQ;q++){
      const a=r.ans[q], k=ex.key[q];
      if(fl.has(q)){ const [u1,v1]=P(...LAYOUT.questions[q][0]); const [u2,v2]=P(...LAYOUT.questions[q][4]);
        x.strokeStyle=col.warn; x.strokeRect(Math.min(u1,u2)-rad*1.2, Math.min(v1,v2)-rad*1.2, Math.abs(u2-u1)+rad*2.4, Math.abs(v2-v1)+rad*2.4); }
      const i=LET.indexOf(a);
      if(i>=0){ const [u,v]=P(...LAYOUT.questions[q][i]); x.strokeStyle= a===k?col.ok:col.bad; x.beginPath(); x.arc(u,v,rad,0,Math.PI*2); x.stroke(); }
      if('ABCDE'.includes(k) && a!==k){ const [u,v]=P(...LAYOUT.questions[q][LET.indexOf(k)]); x.strokeStyle=col.ok; x.setLineDash([rad*.4,rad*.3]); x.beginPath(); x.arc(u,v,rad*.8,0,Math.PI*2); x.stroke(); x.setLineDash([]); }
    }
    LAYOUT.idCols.forEach((colm,ci)=>{ const d=r.sid[ci]; if(d>='0'&&d<='9'){ const [u,v]=P(...colm[+d]); x.strokeStyle=col.ok; x.beginPath(); x.arc(u,v,LAYOUT.idR*RK*1.4,0,Math.PI*2); x.stroke(); } });
  };
  im.src=img.url;
}

  return Object.assign({url:'', token:'', auto:true, sheetName:'', sheetUrl:'', iosHintOff:false}, s); })();

/* ---------- results bookkeeping shared by file scans and the live camera ---------- */
function queueDelete(ex, r){ if(r && r.syncedSig){ (ex.deletes=ex.deletes||[]).push(r.uid); } }
function addResult(ex, r, data, src){
  const res=resultFromRead(r,ex);
  const uid='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const prev=res.sid && /^\d+$/.test(res.sid) ? ex.results.findIndex(x=>x.sid===res.sid) : -1;
  const rec={uid, sid:res.sid, ans:res.ans, flags:res.flags, multi:res.multi, src, at:Date.now()};
  let replaced=false;
  if(prev>=0){ queueDelete(ex, ex.results[prev]); ex.results.splice(prev,1); replaced=true; }
  ex.results.push(rec);
  try{ S.images[uid]={url:rectify(data, r.H)}; }catch(e){}
  return {rec, replaced};
}

/* ---------- Google Sheet sync ---------- */
const Sync={busy:false, timer:null, retry:null, err:null, last:null, again:false};
function sigOf(ex,r){ return [r.sid,r.ans,ex.key,ex.numQ,ex.name,flagsOf(r)].join('|'); }
function dirtyRows(ex){ return ex.results.filter(r=>r.syncedSig!==sigOf(ex,r)); }
function pendingCount(){ return S.exams.reduce((n,ex)=>n+dirtyRows(ex).length+(ex.deletes||[]).length,0); }
function scheduleSync(ms=1500){ updateSyncChip(); if(!Settings.url||!Settings.auto) return; clearTimeout(Sync.timer); Sync.timer=setTimeout(()=>doSync(false),ms); }
function errText(e){
  const m=String(e&&e.message||e);
  if(m==='token') return 'รหัสลับไม่ตรงกับในโค้ด Apps Script';

async function gsPost(payload){

async function doSync(manual){
  if(!Settings.url){ if(manual) toast('ยังไม่ได้เชื่อม Google Sheet'); return; }
  if(Sync.busy){ Sync.again=true; return; }
  if(!navigator.onLine){ Sync.err=errText('offline'); updateSyncChip(); return; }

  let sent=0, removed=0;
  try{
    for(const ex of S.exams){
      const d=dirtyRows(ex), dels=[...(ex.deletes||[])];
      if(!d.length && !dels.length) continue;
      const parts=Math.max(1,Math.ceil(d.length/150));
      for(let i=0;i<parts;i++){
        const chunk=d.slice(i*150,(i+1)*150), sigs=chunk.map(r=>sigOf(ex,r));
        const j=await gsPost({action:'sync',
          exam:{id:ex.id, name:ex.name, numQ:ex.numQ, keyTh:padKey(ex).map(c=>'ABCDE'.includes(c)?thAns(c):'')},
          rows:chunk.map(r=>rowPayload(ex,r)), deletes:i===0?dels:[]});
        if(!j.ok) throw new Error(j.error||'ส่งไม่สำเร็จ');
        chunk.forEach((r,k)=>{ r.syncedSig=sigs[k]; });
        if(i===0){ ex.deletes=(ex.deletes||[]).filter(u=>!dels.includes(u)); removed+=dels.length; }
        if(j.url){ ex.sheetUrl=j.url; }
        sent+=chunk.length;
        await Store.save(ex);
      }
    }
    Sync.err=null; Sync.last=Date.now(); saveSettings();
    if(manual) toast(sent||removed?`ส่งเข้า Google Sheet แล้ว ${sent} คน`:'คะแนนใน Google Sheet เป็นปัจจุบันแล้ว');
  }catch(e){
    Sync.err=errText(e); if(manual) toast('ส่งไม่สำเร็จ: '+Sync.err);
    clearTimeout(Sync.retry); Sync.retry=setTimeout(()=>doSync(false),30000);
  }finally{
    Sync.busy=false; updateSyncChip(); updateGsStatus();
    if(Sync.again){ Sync.again=false; scheduleSync(300); }
  }
}

function feedback(ok){
  try{ if(audioCtx){ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=ok?1320:440; g.gain.setValueAtTime(0.18,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.18); o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.2); } }catch(e){}

function setHint(t,cls){ const h=document.getElementById('camHint'); if(h&&h.textContent!==t){ h.textContent=t; } if(h) h.className='camhint'+(cls?' '+cls:''); }
function quadArea(p){ let a=0; for(let i=0;i<4;i++){ const q=p[(i+1)%4]; a+=p[i][0]*q[1]-q[0]*p[i][1]; } return Math.abs(a)/2; }
function grab(canvas, v, maxDim){
  const vw=v.videoWidth, vh=v.videoHeight, s=Math.min(1,maxDim/Math.max(vw,vh));
  const w=Math.round(vw*s), h=Math.round(vh*s);
  if(canvas.width!==w||canvas.height!==h){ canvas.width=w; canvas.height=h; }
  const x=canvas.getContext('2d',{willReadFrequently:true}); x.drawImage(v,0,0,w,h);
  return {s, data:x.getImageData(0,0,w,h)};
}
function drawOverlay(corners, s, good){
  const v=document.getElementById('camVid'), ov=document.getElementById('camOv'); if(!v||!ov) return;
  const cw=ov.clientWidth, ch=ov.clientHeight, dpr=window.devicePixelRatio||1;
  if(ov.width!==Math.round(cw*dpr)||ov.height!==Math.round(ch*dpr)){ ov.width=Math.round(cw*dpr); ov.height=Math.round(ch*dpr); }
  const x=ov.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,cw,ch);
  if(!corners||!v.videoWidth) return;
  const vw=v.videoWidth, vh=v.videoHeight, k=Math.min(cw/vw,ch/vh), ox=(cw-vw*k)/2, oy=(ch-vh*k)/2;
  const P=corners.map(([a,b])=>[ox+a/s*k, oy+b/s*k]);
  x.lineWidth=4; x.lineJoin='round'; x.strokeStyle=good?'#2ecc71':'#f1c40f'; x.fillStyle=good?'rgba(46,204,113,.14)':'rgba(241,196,15,.10)';

  P.forEach(([a,b])=>{ x.beginPath(); x.arc(a,b,7,0,Math.PI*2); x.fillStyle=good?'#2ecc71':'#f1c40f'; x.fill(); });
}

async function liveLoop(){
  if(!Live.on) return;
  let delay=160;
  const v=document.getElementById('camVid');
  try{
    if(!Live.paused && v && v.readyState>=2 && v.videoWidth){
      const g=grab(Live.small,v,720);
      const loc=OMR.locate({width:g.data.width,height:g.data.height,data:g.data.data},LAYOUT);
      if(loc.error){
        Live.missing++; Live.stable=0; Live.prev=null; Live.attempts=0; drawOverlay(null);
        if(Live.missing>=2) setHint(Live.count?'วางแผ่นถัดไป ให้เห็นสี่เหลี่ยมดำครบ 4 มุม':'เล็งให้เห็นสี่เหลี่ยมดำครบ 4 มุม');
      } else {
        Live.missing=0;
        const W=g.data.width, H=g.data.height, dim=Math.max(W,H);
        const mv=Live.prev?Math.max(...loc.corners.map((p,i)=>Math.hypot(p[0]-Live.prev[i][0],p[1]-Live.prev[i][1])))/dim:1;
        Live.prev=loc.corners;
        Live.stable = mv<0.015 ? Live.stable+1 : 1;
        const area=quadArea(loc.corners)/(W*H);
        drawOverlay(loc.corners,g.s,Live.stable>=3&&area>=0.25);
        if(area<0.25){ setHint('เลื่อนกล้องเข้าใกล้อีกนิด ให้กระดาษเต็มจอ'); Live.stable=0; }

      }
    }

async function liveRead(v){

  el.innerHTML=`<div class="row" style="align-items:flex-start"><div class="grow"><div class="latest-score mono">${s}<small>/${kc}</small></div><div class="mono">${esc(rec.sid||'อ่านรหัสไม่ได้')}</div></div>
    <div style="display:grid;gap:6px;justify-items:end">${f?`<span class="chip warn">ต้องตรวจ ${f} จุด</span>`:'<span class="chip ok">เรียบร้อย</span>'}${replaced?'<span class="chip plain">แทนผลเดิม</span>':''}</div></div>
    <div class="row"><button id="camEdit">${f?'ดูข้อที่ต้องตรวจ':'ดู/แก้คำตอบ'}</button><button id="camAgain" class="ghost">สแกนแผ่นนี้ใหม่</button></div>`;
  $('#camCount').textContent=`สแกนแล้ว ${Live.count} แผ่น`;
  $('#camEdit').onclick=()=>{ Live.paused=true; openReview(rec.uid, ()=>{ Live.paused=false; const ex2=exam(); const r2=ex2.results.find(x=>x.uid===rec.uid); if(r2) showLiveResult(ex2,r2,replaced); }); };
  $('#camAgain').onclick=()=>{ Live.lastSid=null; Live.lastAns=null; Live.lastReadAt=0; el.hidden=true; setHint('ถือนิ่ง ๆ…'); };
}

/* ---------- service worker ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

$('#syncChip').onclick=()=>{ S.tab='gs'; S.pending=null; render(); };
$('#installBtn').onclick=async()=>{ if(!deferredInstall) return; deferredInstall.prompt(); try{ await deferredInstall.userChoice; }catch(e){} deferredInstall=null; $('#installBtn').hidden=true; };
boot();
</script>
</body>
</html>
