<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ตรวจข้อสอบ OMR</title>
<meta name="description" content="ตรวจกระดาษคำตอบแบบฝนด้วยกล้องมือถือ ส่งคะแนนเข้า Google Sheet">
<meta name="theme-color" content="#1f4fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ตรวจข้อสอบ">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:Sarabun;src:url(fonts/sarabun-thai-400.woff2) format('woff2');font-weight:400;unicode-range:U+0E00-0E7F;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-thai-600.woff2) format('woff2');font-weight:500 600;unicode-range:U+0E00-0E7F;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-thai-700.woff2) format('woff2');font-weight:700;unicode-range:U+0E00-0E7F;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-latin-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-latin-600.woff2) format('woff2');font-weight:500 600;font-display:swap}
@font-face{font-family:Sarabun;src:url(fonts/sarabun-latin-700.woff2) format('woff2');font-weight:700;font-display:swap}
/* Layout: one working column (max 1080px) under a sticky tab rail; the answer-form blue is the accent. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --sunk:#e9edf3; --line:#d3d9e3; --ink:#18202c; --muted:#5b6678;
  --accent:#1f4fa8; --accent-ink:#ffffff; --accent-soft:#e2eaf8;
  --ok:#17784a; --ok-soft:#dff2e8; --bad:#b4302a; --bad-soft:#fae3e1; --warn:#9a6200; --warn-soft:#fbefd6;
  --ui:Sarabun,"Noto Sans Thai",system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151c; --surface:#1a2029; --sunk:#232b37; --line:#2f3947; --ink:#e7ecf3; --muted:#9aa6b8;
  --accent:#7ea6f2; --accent-ink:#0d1320; --accent-soft:#1f2c45;
  --ok:#5cc792; --ok-soft:#173326; --bad:#f08a80; --bad-soft:#3a1f1d; --warn:#e5b45a; --warn-soft:#382c14; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151c; --surface:#1a2029; --sunk:#232b37; --line:#2f3947; --ink:#e7ecf3; --muted:#9aa6b8;
  --accent:#7ea6f2; --accent-ink:#0d1320; --accent-soft:#1f2c45;
  --ok:#5cc792; --ok-soft:#173326; --bad:#f08a80; --bad-soft:#3a1f1d; --warn:#e5b45a; --warn-soft:#382c14; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--ui);margin:0;-webkit-tap-highlight-color:transparent}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:20px 12px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:20px;line-height:1.2;margin:0;font-weight:700}
.brand small{display:block;color:var(--muted);font-size:12.5px;font-weight:400}
.exam-pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible,label.btn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
button,.btn{font:inherit;font-weight:500;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover,.btn:hover{border-color:var(--accent)}
.btn.primary,button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);padding-block:4px 0;scrollbar-width:none}
nav.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:9px 14px;border-bottom:2px solid transparent}
nav.tabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
nav.tabs .count{font-family:var(--mono);font-size:12px;background:var(--sunk);border-radius:20px;padding:0 7px;color:var(--muted)}
section.panel{padding-top:20px;display:grid;gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card h2{font-size:16px;margin:0 0 4px}
.card h3{font-size:14.5px;margin:0 0 6px}
.hint{color:var(--muted);font-size:13.5px;margin:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grow{flex:1 1 200px;min-width:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:20px;padding:1px 9px;font-size:12.5px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.plain{background:var(--sunk);color:var(--muted)}
/* key grid */
.keygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:2px 18px}
.krow{display:flex;align-items:center;gap:4px;padding:2px 0}
.krow .n{width:30px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--muted);margin-right:4px}
.bub{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);font-size:12px;padding:0;justify-content:center;line-height:1}
.bub:hover{border-color:var(--accent)}
.bub.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.bub.on.right{background:var(--ok);border-color:var(--ok)}
.bub.on.wrong{background:var(--bad);border-color:var(--bad)}
.bub.det{box-shadow:0 0 0 2px var(--warn)}
.krow.missing .n{color:var(--bad);font-weight:600}
/* drop zone */
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;display:grid;gap:12px;justify-items:center;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop input{position:absolute;width:1px;height:1px;opacity:0}
.btn.big,button.big{padding:11px 20px;font-size:16px}
.latest{display:grid;gap:14px}
.latest.okb{border-color:var(--ok)} .latest.warnb{border-color:var(--warn)} .latest.badb{border-color:var(--bad)}
.latest-main{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-start;justify-content:space-between}
.latest-score{font-size:44px;font-weight:600;line-height:1.1}
.latest-score small{font-size:20px;color:var(--muted);font-weight:400}
.progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;width:100%;max-width:420px}
.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
/* tables */
.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--sunk);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.stat b{display:block;font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.3}
.stat span{font-size:12.5px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.choicebar{display:flex;height:16px;border-radius:4px;overflow:hidden;min-width:150px;background:var(--sunk)}
.choicebar i{display:block;height:100%}
/* review drawer */
.overlay{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:20;display:flex;justify-content:flex-end}
.drawer{background:var(--bg);width:min(1000px,100%);height:100%;overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-head{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px 16px;z-index:2}
.drawer-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding:16px}
@media (max-width:760px){.drawer-body{grid-template-columns:minmax(0,1fr)}}
.sheetview{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.sheetview canvas{display:block;width:100%;height:auto}
.toast{z-index:60!important;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:40;font-size:14px;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 12px}
.sheetprev{max-width:340px;width:100%;border:1px solid var(--line);border-radius:6px;background:#fff}
.two{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:700px){.two{grid-template-columns:minmax(0,1fr)}}
ol.tips{margin:6px 0 0;padding-left:20px;display:grid;gap:4px}
.hist{display:flex;align-items:flex-end;gap:2px;height:110px;padding-top:6px}
.hist div{flex:1;background:var(--accent);border-radius:2px 2px 0 0;min-height:1px;opacity:.85}
.histax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.hdr-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.syncchip{border:0;cursor:pointer;font:inherit;font-size:13px;padding:4px 11px}
#layer2 .overlay{z-index:45}
.steps{margin:6px 0 10px;padding-left:22px;display:grid;gap:10px}
pre.code{max-height:260px;overflow:auto;background:var(--sunk);border-radius:8px;padding:10px;font:12px/1.5 var(--mono);white-space:pre}
summary{cursor:pointer}
.cam{position:fixed;inset:0;z-index:30;background:#000;color:#fff}
.cam video,.cam #camOv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.camtop{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 18px max(12px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,0))}
.camtop>div{flex:1;min-width:0;display:grid;line-height:1.35}
.camtop>div b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.camtop span{font-size:13px;opacity:.85}
.camtop button{background:rgba(255,255,255,.16);color:#fff;border-color:transparent}
.camtop button.primary{background:#2f6fe0;color:#fff}
.camtop button.on{background:#f1c40f;color:#111}
.camhint{position:absolute;left:50%;transform:translateX(-50%);top:calc(74px + env(safe-area-inset-top,0px));background:rgba(0,0,0,.62);color:#fff;padding:7px 16px;border-radius:20px;font-size:15px;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
.camhint.done{background:#17784a}
.camres{position:absolute;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:520px;background:var(--surface);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px}
.camres.okb{border-color:var(--ok)} .camres.warnb{border-color:var(--warn)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;border-right:1px solid var(--line);padding:6px 12px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.field{display:grid;gap:3px;min-width:0}
.field>span{font-size:13px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.modal{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:46;display:grid;place-items:center;padding:16px}
.modal>div{background:var(--bg);border-radius:14px;padding:20px;width:min(460px,100%);display:grid;gap:14px;max-height:90vh;overflow:auto}
.choicecard{display:grid;gap:4px;text-align:left;padding:14px;border-radius:10px;white-space:normal}
.choicecard b{font-size:16px}
.sheetwrap{background:var(--sunk);border-radius:var(--r);padding:12px;overflow:hidden}
.sheetwrap iframe{border:0;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.2);transform-origin:0 0;display:block}
.krow .x{margin-left:6px;padding:2px 8px;font-size:12px}
.krow .x.on{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.krow.cancel .bub{opacity:.35}
td.name{white-space:normal;min-width:140px}
.suggest{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:140px}
.warnbox{border-color:var(--warn)!important}
.badbox{border-color:var(--bad)!important}
.miss{display:flex;flex-wrap:wrap;gap:6px}
img.nimg{display:block;max-width:220px;width:100%;height:auto;margin-top:4px;border-radius:4px;border:1px solid var(--line);background:#fff}
img.nimg.big{max-width:100%}
.camres img.nimg{max-width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="8" fill="var(--accent)"/><circle cx="11" cy="12" r="4" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/><circle cx="23" cy="12" r="4" fill="var(--accent-ink)"/><circle cx="11" cy="23" r="4" fill="var(--accent-ink)"/><circle cx="23" cy="23" r="4" fill="none" stroke="var(--accent-ink)" stroke-width="1.6"/></svg>
      <div><h1>ตรวจข้อสอบ</h1><small>กระดาษคำตอบแบบฝน · คณะวิทยาศาสตร์และเทคโนโลยี มรภ.สงขลา</small></div>
    </div>
    <div class="hdr-actions"><button id="syncChip" class="chip plain syncchip">Google Sheet</button><button id="installBtn" class="primary" hidden>ติดตั้งแอป</button></div>
    <div class="exam-pick">
      <label for="examSel" class="hint">ชุด</label>
      <select id="examSel"></select>
      <button id="newExam">+ ชุดใหม่</button>
    </div>
  </header>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="scan" aria-selected="true">สแกน</button>
    <button role="tab" data-tab="scores">คะแนน <span class="count" id="cntScores">0</span></button>
    <button role="tab" data-tab="key" id="tabKey">เฉลย</button>
    <button role="tab" data-tab="items" id="tabItems">วิเคราะห์ข้อสอบ</button>
    <button role="tab" data-tab="sheet">กระดาษคำตอบ</button>
    <button role="tab" data-tab="roster">รายชื่อ</button>
    <button role="tab" data-tab="gs">ตั้งค่า</button>
  </nav>
  <main id="main"></main>
</div>
<div id="layer"></div>
<div id="layer2"></div>

<script src="omr.js"></script>
<script src="layout.js"></script>
<script src="gscode.js"></script>
<script src="app.js"></script>
</body>
</html>
